name: Export Figma Color Tokens

permissions:
  contents: write

on:
  push:
    paths:
      - 'projects/tokens/src/**'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Export Figma colors
        run: node projects/tokens/scripts/export-colors-to-figma.mjs

      - name: Upload tokens as artifact
        uses: actions/upload-artifact@v4
        with:
          name: figma-color-tokens
          path: projects/tokens/export/tokens.colors.json

      - name: Commit exported tokens
        run: |
          git config user.name "dirawong-bot"
          git config user.email "bot@dirawong.dev"
          git add projects/tokens/export/tokens.colors.json
          git commit -m "chore(tokens): export figma color tokens" || echo "No changes"
          git push
