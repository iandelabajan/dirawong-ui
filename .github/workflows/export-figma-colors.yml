name: Export Figma Color Tokens

on:
  workflow_dispatch:
  push:
    paths:
      - 'tokens/tokens.css'

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Export Figma colors
        run: node tokens/scripts/export-colors-to-figma.js

      - name: Commit exported tokens
        run: |
          git config user.name "dirawong-bot"
          git config user.email "bot@dirawong.dev"
          git add tokens/export/figma.colors.json
          git commit -m "chore(tokens): export figma color tokens" || echo "No changes"
          git push
