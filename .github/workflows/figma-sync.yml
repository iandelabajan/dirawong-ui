name: Sync Tokens to Figma

on:
  push:
    branches: [main]
    paths:
      - "projects/tokens/**"
      - "scripts/**"

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Figma tokens
        run: npm run tokens:figma

      - name: Sync tokens to Figma
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          FIGMA_FILE_ID: ${{ secrets.FIGMA_FILE_ID }}
        run: node scripts/sync-figma-tokens.mjs
